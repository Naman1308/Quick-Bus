<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Buses">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Buses</title>
<style>
  :root {
    --bg: #0e0f12; --card: #17191e; --well: #101216; --line: #262930; --text: #f2f2f0; --dim: #8b8f98;
    --accent: #2f6df6; --now: #3ddc84; --warn: #ffb547; --alert: #ff6b5e;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 2px 18px; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  #updated { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 12px; overflow: hidden; }
  .stop-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 16px; min-height: 64px; }
  .label { font-weight: 650; font-size: 17px; }
  .sub { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .side { display: flex; align-items: flex-start; gap: 8px; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .chev { transition: transform .2s; flex: none; }
  [aria-expanded="true"] > .side .chev, [aria-expanded="true"] > .chev { transform: rotate(180deg); }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--dim); }
  .dir { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 6px; letter-spacing: .01em; }
  .dir.down { background: #3a2a12; color: #ffc46b; }
  .dir.up { background: #123326; color: #6fe3a5; }
  .dir.east, .dir.west { background: #1f2547; color: #a9b8ff; }
  .near { font-size: 12px; font-weight: 700; color: var(--now); }
  .summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pill { font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 7px; background: var(--well); border: 1px solid #2a2d35; font-variant-numeric: tabular-nums; }
  .pill.soon { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stop-body { padding: 0 14px 6px; }
  .route { border-top: 1px solid var(--line); }
  .route-head { width: 100%; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto 18px; gap: 12px; align-items: center; padding: 12px 2px; min-height: 60px; }
  .route.none .route-head { opacity: .55; }
  .chip.sub { background: #00933c; width: 32px; height: 32px; padding: 0; border-radius: 50%; display: grid; place-items: center; font-size: 16px; justify-self: center; }
  .opt-steps .chip-s.sub { background: #00933c; border-radius: 50%; min-width: 18px; text-align: center; padding: 1px 4px; }
  .chip { background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; padding: 5px 0; border-radius: 8px; text-align: center; }
  .dest { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .then { display: block; font-size: 13px; color: var(--dim); margin-top: 2px; }
  .eta { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .eta b { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .eta span { font-size: 13px; color: var(--dim); }
  .eta.now b { color: var(--now); }
  .buses { margin: 0 2px 12px; background: var(--well); border: 1px solid var(--line); border-radius: 12px; padding: 2px 12px; }
  .bus { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .bus:first-child { border-top: 0; }
  .bus .m { font-variant-numeric: tabular-nums; }
  .bus .m b { font-size: 18px; }
  .bus .m span, .bus .x, .bus .clock { color: var(--dim); font-size: 12px; }
  .bus .w { font-size: 13px; }
  .bus .x { display: block; margin-top: 2px; }
  .term { color: var(--warn); }
  .alert { color: var(--alert); font-size: 13px; margin: 0 2px 10px; }
  .alert summary { cursor: pointer; }
  .alert.other summary { color: var(--dim); }
  .alert p { color: var(--text); margin-top: 6px; white-space: pre-wrap; }
  .empty, .err { color: var(--dim); font-size: 14px; padding: 4px 2px 12px; }
  .err { color: var(--alert); }
  /* Best route */
  .plan { padding: 0; }
  .plan-head { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 16px; min-height: 60px; }
  .plan-head .sub b { color: var(--now); font-weight: 700; }
  .plan-body { padding: 0 16px 6px; }
  .plan-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .plan-title { font-weight: 700; font-size: 17px; }
  .seg { display: inline-flex; background: var(--well); border: 1px solid #2a2d35; border-radius: 10px; padding: 2px; }
  .seg button { min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .plan-from { font-size: 13px; color: var(--dim); margin-top: 6px; }
  .by { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--dim); }
  .by input { background: var(--well); border: 1px solid #2a2d35; border-radius: 10px; color: var(--text); font: inherit; padding: 8px 10px; min-height: 40px; color-scheme: dark; }
  .by button { color: #8fb0ff; font-size: 14px; min-height: 40px; padding: 0 4px; }
  .opt { border-top: 1px solid var(--line); padding: 12px 0 10px; margin-top: 12px; }
  .opt + .opt { margin-top: 0; }
  .opt-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .opt-name { font-size: 15px; font-weight: 600; }
  .best-tag { font-size: 11px; font-weight: 700; color: #0e0f12; background: var(--now); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; }
  .opt-arr { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .opt-arr b { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .opt.best .opt-arr b { color: var(--now); }
  .opt-arr span { font-size: 12px; color: var(--dim); }
  .opt-leave { font-size: 13px; margin-top: 2px; }
  .opt-steps { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .opt-steps .chip-s { display: inline-block; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 5px; }
  .opt.dim { opacity: .55; }
  .lookup { display: flex; gap: 8px; margin: 22px 0 12px; }
  .lookup input {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; color: var(--text);
    font: inherit; padding: 12px 14px; font-variant-numeric: tabular-nums;
  }
  .lookup button { flex: none; background: var(--accent); border-radius: 12px; padding: 0 18px; font-weight: 600; }
  .foot { text-align: center; color: var(--dim); font-size: 12px; margin-top: 18px; }
  .spin { opacity: .6; transition: opacity .2s; }
</style>
</head>
<body>
<header>
  <h1>Buses</h1>
  <button id="refresh" aria-label="Refresh"><span id="updated">Loading…</span> ↻</button>
</header>

<section class="card plan" id="plan" aria-live="polite"></section>
<main id="stops"></main>

<form class="lookup" id="lookup">
  <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="Any stop code (6 digits)" autocomplete="off" aria-label="Stop code">
  <button type="submit">Check</button>
</form>
<main id="adhoc"></main>

<p class="foot">Live data from MTA Bus Time · refreshes every 30s</p>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CHEV = `<svg class="chev" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b8f98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;

let stops = [];
let adhoc = null;
const cache = {}; // stop code -> last response

// Location: nearest saved stop goes first and opens on its own (until you close it).
let here = null;
const dismissed = new Set(); // auto-opened cards you closed this session
const DIRS = { down: "↓ Downtown", up: "↑ Uptown", east: "→ East", west: "← West" };
function milesTo(s) {
  if (!here || s.lat == null) return null;
  const R = 3958.8, rad = (d) => (d * Math.PI) / 180;
  const dLat = rad(s.lat - here.lat), dLon = rad(s.lon - here.lon);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(here.lat)) * Math.cos(rad(s.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function orderedStops() {
  if (!here) return stops;
  return [...stops].sort((a, b) => (milesTo(a) ?? 1e9) - (milesTo(b) ?? 1e9));
}
function nearestKey() {
  if (!here) return null;
  const s = orderedStops()[0];
  const d = s && milesTo(s);
  return d != null && d < 0.6 ? `s:${s.stop}` : null; // only when you're actually near one
}
const isOpen = (key) => open.has(key) || (key === nearestKey() && !dismissed.has(key));
function locate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (p) => { here = { lat: p.coords.latitude, lon: p.coords.longitude }; render(); },
    () => {}, { enableHighAccuracy: false, maximumAge: 60000, timeout: 10000 });
}

// Which stops / routes are open. Everything starts collapsed; your choices are remembered on this phone.
const open = (() => {
  try { return new Set(JSON.parse(localStorage.getItem("qb-open") || "[]")); } catch { return new Set(); }
})();
const saveOpen = () => { try { localStorage.setItem("qb-open", JSON.stringify([...open])); } catch {} };

async function getArrivals(code) {
  try {
    const r = await fetch(`/api/arrivals?stop=${code}`);
    const data = await r.json().catch(() => ({ error: "Bad response" }));
    if (!r.ok && !data.error) data.error = `Error ${r.status}`;
    return data;
  } catch (e) { return { error: "Can't reach the server" }; }
}

const subKey = (from, to, routes) => `sub:${from}>${to}:${routes.join(",")}`;
async function getSubway(from, to, routes) {
  try {
    const r = await fetch(`/api/subway?from=${from}&to=${to}&routes=${routes.join(",")}`);
    const d = await r.json().catch(() => ({ error: "Bad response" }));
    if (!r.ok && !d.error) d.error = `Error ${r.status}`;
    return d;
  } catch { return { error: "Can't reach the server" }; }
}
// Make subway runs look like bus arrivals so the same cards can show them.
function subwayAsArrivals(stop, d) {
  if (!d || d.error) return d;
  const now = Date.now();
  return { buses: d.runs.map((r) => ({ route: r.route, destination: `${stop.toName || "destination"}, arrives ${new Date(r.arr).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`,
    expected: new Date(r.dep).toISOString(), minutes: Math.max(0, Math.round((r.dep - now) / 60000)) })), alerts: [] };
}
const isSubway = (route) => /^[1-7A-Z]$/.test(route || "");
const dataFor = (s) => (s.type === "subway" ? subwayAsArrivals(s, cache[subKey(s.stop, s.to, s.routes)]) : cache[s.stop]);
const clock = (b) => {
  const t = b.expected ? new Date(b.expected) : b.minutes != null ? new Date(Date.now() + b.minutes * 60000) : null;
  return t ? t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
};
const KEEP = new Set(["LES", "FDR", "SBS", "JFK", "LGA", "CUNY", "MTA", "NYU"]);
const nice = (t) => String(t || "").toLowerCase().replace(/[a-z0-9']+/g, (w, i) =>
  KEEP.has(w.toUpperCase()) ? w.toUpperCase() : (i > 0 && ["via", "to", "and", "of", "the"].includes(w)) ? w : w[0].toUpperCase() + w.slice(1));
const isNow = (b) => b.minutes === 0 || /approaching|at stop/i.test(b.proximity || "");

// Group a stop's buses by route, keeping only the routes you saved for it.
function groupRoutes(stop, data) {
  const want = (stop.routes || []).map((r) => r.toUpperCase());
  const keep = (r) => !want.length || want.some((w) => r.toUpperCase().startsWith(w));
  const by = new Map();
  for (const b of data.buses || []) {
    if (!b.route || !keep(b.route)) continue;
    if (!by.has(b.route)) by.set(b.route, []);
    by.get(b.route).push(b);
  }
  for (const list of by.values()) list.sort((a, b) => (a.minutes ?? 999) - (b.minutes ?? 999));
  const routes = [...by.entries()].map(([route, buses]) => ({ route, buses, next: buses[0].minutes }));
  // Saved routes with nothing tracked still get a (dimmed) row.
  for (const w of want) if (!routes.some((r) => r.route.toUpperCase().startsWith(w))) routes.push({ route: w, buses: [], next: null });
  return routes.sort((a, b) => (a.next ?? 999) - (b.next ?? 999));
}

function alertsHtml(data) {
  // Alerts come for the whole route; surface ones that mention this stop's streets, fold the rest.
  const nums = [...(data.stopName || "").matchAll(/\b(\d+)\s*ST\b/gi)].map((m) => m[1]);
  const avs = [...(data.stopName || "").matchAll(/\b(LEXINGTON|PARK|MADISON|BROADWAY|UNIVERSITY|IRVING|\d+)\s*(AV|PL)?\b/gi)].map((m) => m[1]);
  const hits = (a) => {
    const t = `${a.summary} ${a.description || ""}`;
    return nums.some((n) => new RegExp(`\\b${n}(st|nd|rd|th)?\\s*st`, "i").test(t)) &&
      (!avs.length || avs.some((v) => new RegExp(`\\b${v}(st|nd|rd|th)?\\b`, "i").test(t)));
  };
  const all = data.alerts || [];
  const near = all.filter(hits), other = all.filter((a) => !hits(a));
  return near.map((a) =>
    `<details class="alert"><summary>⚠ ${esc(a.summary || "Service notice")}</summary>${a.description && a.description !== a.summary ? `<p>${esc(a.description)}</p>` : ""}</details>`).join("") +
    (other.length ? `<details class="alert other"><summary>${other.length} other notice${other.length > 1 ? "s" : ""} on these routes</summary>${other.map((a) => `<p>• ${esc(a.summary)}</p>`).join("")}</details>` : "");
}

function busRow(b) {
  const away = b.stopsAway === 0 ? (b.proximity || "Approaching")
    : b.stopsAway != null ? `${b.stopsAway} stop${b.stopsAway == 1 ? "" : "s"} away` : (b.proximity || "");
  const extra = [b.miles ? `${b.miles} mi` : null, b.passengers != null ? `~${b.passengers} on board` : null].filter(Boolean).join(" · ");
  const flag = b.atTerminal ? `<span class="term">at terminal</span>` : b.prevTrip ? `<span class="term">finishing previous trip</span>` : "";
  return `<div class="bus">
    <span class="m">${b.minutes != null ? `<b>${b.minutes}</b><span> min</span>` : "—"}</span>
    <span class="w">${esc(away)}<span class="x">${esc(extra)}${extra && flag ? " · " : ""}${flag || (extra ? "" : "&nbsp;")}</span></span>
    <span class="clock">${clock(b)}</span>
  </div>`;
}

function routeRow(key, r) {
  const rOpen = open.has(key);
  if (!r.buses.length) {
    return `<div class="route none"><div class="route-head"><span class="chip ${isSubway(r.route) ? "sub" : ""}">${esc(r.route)}</span>
      <span><span class="dest">Nothing tracked right now</span></span><span></span><span></span></div></div>`;
  }
  const first = r.buses[0];
  const later = r.buses.slice(1, 4).map((b) => b.minutes).filter((m) => m != null);
  return `<div class="route">
    <button class="route-head" data-toggle="${esc(key)}" aria-expanded="${rOpen}">
      <span class="chip ${isSubway(r.route) ? "sub" : ""}">${esc(r.route)}</span>
      <span style="min-width:0"><span class="dest">to ${esc(isSubway(r.route) ? first.destination : nice(first.destination))}</span><span class="then">${later.length ? `then ${later.join(" · ")} min` : isSubway(r.route) ? "no other trains tracked" : "no other buses tracked"}</span></span>
      <span class="eta ${isNow(first) ? "now" : ""}">${first.minutes != null ? `<b>${first.minutes}</b><span> min</span>` : `<span>${esc(first.proximity || "")}</span>`}</span>
      ${CHEV}
    </button>
    ${rOpen ? `<div class="buses">${r.buses.slice(0, 6).map(busRow).join("")}</div>` : ""}
  </div>`;
}

function card(stop, data, { alwaysOpen = false } = {}) {
  const key = `s:${stop.stop}`;
  const cOpen = alwaysOpen || isOpen(key);
  const routes = data && !data.error ? groupRoutes(stop, data) : [];
  const live = routes.filter((r) => r.next != null);

  let summary = "";
  if (!cOpen) {
    if (!data) summary = `<div class="sub">Loading…</div>`;
    else if (data.error) summary = `<div class="sub" style="color:var(--alert)">${esc(data.error)}</div>`;
    else if (!live.length) summary = `<div class="sub">No buses tracked right now</div>`;
    else summary = `<div class="summary">${live.map((r, i) => `<span class="pill ${i === 0 ? "soon" : ""}">${esc(r.route)}${isSubway(r.route) ? " train" : ""} ${r.next}′</span>`).join("")}</div>`;
  }

  let body = "";
  if (cOpen) {
    if (!data) body = `<p class="empty">Loading…</p>`;
    else if (data.error) body = `<p class="err">${esc(data.error)}</p>`;
    else body = alertsHtml(data) + (routes.length ? routes.map((r) => routeRow(`r:${stop.stop}:${r.route}`, r)).join("") : `<p class="empty">No buses tracked right now.</p>`);
  }

  const title = stop.label || data?.stopName || "Stop " + stop.stop;
  const d = milesTo(stop);
  const nearest = key === nearestKey();
  const meta = [
    stop.dir && DIRS[stop.dir] ? `<span class="dir ${esc(stop.dir)}">${DIRS[stop.dir]}</span>` : "",
    stop.from ? `<span>from ${esc(stop.from)}</span>` : "",
  ].join("");
  const dist = nearest ? `<span class="near">Nearest · ${d < 0.1 ? "here" : d.toFixed(1) + " mi"}</span>`
    : d != null ? `<span>${d.toFixed(1)} mi</span>` : "";
  return `<section class="card">
    <button class="stop-head" ${alwaysOpen ? "" : `data-toggle="${esc(key)}"`} aria-expanded="${cOpen}">
      <div style="min-width:0"><div class="label">${esc(title)}</div>${meta || dist ? `<div class="meta">${meta}${dist}</div>` : ""}${stop.note ? `<div class="sub">${esc(stop.note)}</div>` : ""}${summary}</div>
      <div class="side">${alwaysOpen ? "#" + esc(stop.stop) : CHEV}</div>
    </button>
    ${cOpen ? `<div class="stop-body">${body}</div>` : ""}
  </section>`;
}


// ---------- Best route ----------
// For each way of getting there: walk to the stop, catch the first bus you can make, follow that exact bus
// (by vehicle id) to the drop-off stop, then walk. Rank by arrival, or by latest departure for an "arrive by" time.
let PLAN = null;
let dest = (() => { try { return localStorage.getItem("qb-dest"); } catch { return null; } })();
let deadline = ""; // "HH:MM" or ""
let fetchedAt = Date.now();

function walkMin(a, b) {
  // Manhattan's street grid is rotated ~29°; measure along avenues + streets, ~2.9 mph, +1 min for lights.
  const dx = (b.lon - a.lon) * 69.17 * Math.cos((a.lat * Math.PI) / 180), dy = (b.lat - a.lat) * 69.17;
  const th = (29 * Math.PI) / 180;
  const along = Math.abs(dx * Math.sin(th) + dy * Math.cos(th)), across = Math.abs(dx * Math.cos(th) - dy * Math.sin(th));
  return Math.round(((along + across) / 2.9) * 60 + 1);
}
const tOf = (b) => (b.expected ? Date.parse(b.expected) : b.minutes != null ? fetchedAt + b.minutes * 60000 : null);
const hm = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const routeOk = (r, want) => want.some((w) => (r || "").toUpperCase().startsWith(w.toUpperCase()));

// Buses at a leg's boarding stop, each with the time that same bus reaches the drop-off.
function legRuns(leg, boardCode = leg.board) {
  if (leg.mode === "subway") {
    const d = cache[subKey(leg.board, leg.alight, leg.routes)];
    return !d || d.error ? null : d.runs.map((r) => ({ ...r }));
  }
  const board = cache[boardCode], alight = cache[leg.alight];
  if (!board || board.error || !alight || alight.error) return null;
  const at = new Map(), servedRoutes = new Set();
  for (const b of alight.buses || []) { if (b.vehicle) at.set(b.vehicle, tOf(b)); servedRoutes.add(b.route); }
  const runs = [];
  for (const b of board.buses || []) {
    if (!routeOk(b.route, leg.routes)) continue;
    const dep = tOf(b);
    if (dep == null) continue;
    let arr = b.vehicle ? at.get(b.vehicle) : null;
    if (arr == null && servedRoutes.has(b.route)) arr = dep + (leg.ride || 12) * 60000; // bus too far out to be listed yet
    if (arr == null || arr <= dep) continue; // e.g. a Limited that skips the drop-off
    runs.push({ route: b.route, dep, arr });
  }
  return runs;
}

// Follow an option from `from` starting at time t0. firstRun forces which bus to take on leg 1.
function chain(opt, from, t0, firstRun) {
  const to = PLAN.places[opt.to];
  if (opt.walk) { const w = walkMin(from, to); return { leave: t0, arrive: t0 + w * 60000, steps: [{ walk: w }] }; }
  let pos = from, t = t0, leave = null; const steps = [];
  for (let i = 0; i < opt.legs.length; i++) {
    const leg = opt.legs[i], off = PLAN.stops[leg.alight];
    // A leg can offer several boarding stops (e.g. 36 St or 39 St); take whichever gets you off soonest.
    let pick = null, anyData = false;
    for (const code of [].concat(leg.board)) {
      const stop = PLAN.stops[code];
      const w = walkMin(pos, stop) + (leg.enter || 0), ready = t + w * 60000;
      const runs = legRuns(leg, code);
      if (!runs) continue;
      anyData = true;
      let run;
      if (i === 0 && firstRun) { run = firstRun.code === code || firstRun.code == null ? firstRun : null; if (run && run.dep < ready - 30000) run = null; }
      else run = runs.filter((r) => r.dep >= ready - 30000).sort((a, b) => a.arr - b.arr)[0];
      if (run && (!pick || run.arr < pick.run.arr || (run.arr === pick.run.arr && run.dep - w * 60000 > pick.leave))) pick = { run, w, stop, leave: run.dep - w * 60000 };
    }
    if (!anyData) return { missing: true };
    if (!pick) return null;
    const { run, w, stop } = pick;
    if (i === 0) leave = pick.leave;
    steps.push({ walk: w, to: stop.name }, { route: run.route, dep: run.dep, arr: run.arr, off: off.name });
    pos = off; t = run.arr + (leg.exit || 0) * 60000;
  }
  const wEnd = walkMin(pos, to);
  steps.push({ walk: wEnd, to: to.name });
  return { leave, arrive: t + wEnd * 60000, steps };
}

function deadlineTime() {
  if (!deadline) return null;
  const [h, m] = deadline.split(":").map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  if (d.getTime() < Date.now() - 60000) d.setDate(d.getDate() + 1);
  return d.getTime();
}

function planOptions(from) {
  const now = Date.now(), by = deadlineTime();
  return PLAN.options.filter((o) => o.to === dest).map((opt) => {
    if (opt.walk) {
      const c = chain(opt, from, now);
      if (by) { const dur = c.arrive - now; return { opt, ...c, leave: by - dur, arrive: by, ok: by - dur >= now - 60000 }; }
      return { opt, ...c, ok: true };
    }
    if (!by) { const c = chain(opt, from, now); return c && !c.missing ? { opt, ...c, ok: true } : { opt, none: true, missing: c?.missing }; }
    // Arrive-by: try each catchable first bus, keep the latest departure that still makes it.
    const boards = [].concat(opt.legs[0].board);
    if (boards.every((c) => !legRuns(opt.legs[0], c))) return { opt, none: true, missing: true };
    const runs = boards.flatMap((code) => (legRuns(opt.legs[0], code) || []).map((r) => ({ ...r, code })));
    let best = null, latestSeen = 0, earliest = null;
    for (const r of runs) {
      const c = chain(opt, from, now, r);
      if (!c || c.missing) continue;
      latestSeen = Math.max(latestSeen, c.arrive);
      if (!earliest || c.arrive < earliest.arrive) earliest = c;
      if (c.arrive <= by && c.leave >= now - 60000 && (!best || c.leave > best.leave)) best = c;
    }
    if (best) return { opt, ...best, ok: true };
    if (latestSeen && latestSeen < by) return { opt, tooEarly: true, sample: earliest };
    return { opt, late: true, earliest };
  });
}

function stepsHtml(steps) {
  return steps.map((st) => st.route
    ? `<span class="chip-s ${isSubway(st.route) ? "sub" : ""}">${esc(st.route)}</span> ${hm(st.dep)} → off ${esc(st.off)} ${hm(st.arr)}`
    : `Walk ${st.walk} min${st.to ? ` to ${esc(st.to)}` : ""}`).join(" · ");
}

function renderPlan() {
  const el = $("#plan");
  if (!PLAN) { el.style.display = "none"; return; }
  el.style.display = "";
  const places = PLAN.places;
  let fromLabel, from;
  const nearPlace = here && Object.entries(places).find(([, p]) => walkMin(here, p) <= 5);
  if (!dest) dest = nearPlace && nearPlace[0] === "parsons" ? "home" : "parsons";
  if (here && !(nearPlace && nearPlace[0] === dest)) { from = here; fromLabel = nearPlace ? `From ${places[nearPlace[0]].name}` : "From where you are"; }
  else { const other = Object.keys(places).find((k) => k !== dest); from = places[other]; fromLabel = `Assuming you leave from ${places[other].name}`; }

  const res = planOptions(from);
  const by = deadlineTime();
  const good = res.filter((r) => r.ok);
  good.sort((a, b) => (by ? b.leave - a.leave || a.arrive - b.arrive : a.arrive - b.arrive || b.leave - a.leave));
  const bestR = good[0];
  const now = Date.now();

  const rows = [...good, ...res.filter((r) => !r.ok)].map((r) => {
    const isBest = r === bestR;
    if (!r.ok) {
      let why = r.missing ? "Loading live times…" : r.opt.walk ? `Too far to walk there by ${hm(by)}` : "No bus you can catch is tracked right now";
      if (r.tooEarly && r.sample) why = `Too early for live times. It takes about ${Math.round((r.sample.arrive - r.sample.leave) / 60000)} min, so leave around ${hm(by - (r.sample.arrive - r.sample.leave) - 5 * 60000)}`;
      if (r.late && r.earliest) why = `Can't make ${hm(by)}. Earliest arrival is ${hm(r.earliest.arrive)}`;
      return `<div class="opt dim"><div class="opt-row"><span class="opt-name">${esc(r.opt.name)}</span></div><div class="opt-steps">${why}</div></div>`;
    }
    const leaveIn = Math.round((r.leave - now) / 60000);
    const leaveTxt = leaveIn <= 0 ? "Leave now" : `Leave in ${leaveIn} min (${hm(r.leave)})`;
    const diff = !isBest && bestR ? (by ? Math.round((bestR.leave - r.leave) / 60000) : Math.round((r.arrive - bestR.arrive) / 60000)) : 0;
    const right = by
      ? `<b>${hm(r.leave)}</b><br><span>leave by${diff > 0 ? ` · ${diff} min earlier` : ""}</span>`
      : `<b>${hm(r.arrive)}</b><br><span>arrive${diff > 0 ? ` · +${diff} min` : ""}</span>`;
    return `<div class="opt ${isBest ? "best" : ""}">
      <div class="opt-row">
        <div><span class="opt-name">${esc(r.opt.name)}</span>${isBest ? `<span class="best-tag">BEST</span>` : ""}
          <div class="opt-leave">${by ? `Arrive ${hm(r.arrive)}` : leaveTxt} · ${Math.round((r.arrive - r.leave) / 60000)} min trip</div></div>
        <div class="opt-arr">${right}</div>
      </div>
      <div class="opt-steps">${stepsHtml(r.steps)}</div>
    </div>`;
  }).join("");

  const pOpen = open.has("plan");
  const teaser = bestR
    ? `${esc(bestR.opt.name)} to ${esc(places[dest].name)} · ${by ? `leave by <b>${hm(bestR.leave)}</b>` : `arrive <b>${hm(bestR.arrive)}</b>`}`
    : `Plan a trip to ${esc(places[dest].name)}`;
  el.innerHTML = `
    <button class="plan-head" data-toggle="plan" aria-expanded="${pOpen}">
      <div style="min-width:0"><div class="plan-title">Best route</div>${pOpen ? "" : `<div class="sub">${teaser}</div>`}</div>
      ${CHEV}
    </button>
    ${pOpen ? `<div class="plan-body">
      <span class="seg" role="group" aria-label="Destination">
        ${Object.entries(places).map(([k, p]) => `<button data-dest="${k}" aria-pressed="${k === dest}">to ${esc(p.name)}</button>`).join("")}
      </span>
      <div class="plan-from">${esc(fromLabel)}</div>
      <div class="by"><label for="by">Arrive by</label><input id="by" type="time" value="${esc(deadline)}">${deadline ? `<button data-clear-by>Clear</button>` : `<span>or leave now</span>`}</div>
      ${rows}
    </div>` : ""}`;
}

document.addEventListener("click", (e) => {
  const d = e.target.closest("[data-dest]");
  if (d) { dest = d.dataset.dest; try { localStorage.setItem("qb-dest", dest); } catch {} renderPlan(); }
  if (e.target.closest("[data-clear-by]")) { deadline = ""; renderPlan(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "by") { deadline = e.target.value; renderPlan(); }
});

function render() {
  $("#stops").innerHTML = orderedStops().map((s) => card(s, dataFor(s))).join("") || `<p class="empty">No saved stops yet.</p>`;
  renderPlan();
  $("#adhoc").innerHTML = adhoc ? card({ stop: adhoc }, cache[adhoc], { alwaysOpen: true }) : "";
}

async function refresh() {
  $("#stops").classList.add("spin");
  const isBusCode = (c) => /^\d{6}$/.test(c);
  const planCodes = PLAN ? Object.keys(PLAN.stops).filter(isBusCode) : [];
  const codes = [...new Set([...stops.filter((s) => s.type !== "subway").map((s) => s.stop), ...planCodes, ...(adhoc ? [adhoc] : [])])];
  const subs = new Map();
  for (const s of stops) if (s.type === "subway") subs.set(subKey(s.stop, s.to, s.routes), [s.stop, s.to, s.routes]);
  for (const o of PLAN?.options || []) for (const l of o.legs || []) if (l.mode === "subway") subs.set(subKey(l.board, l.alight, l.routes), [l.board, l.alight, l.routes]);
  const subResults = await Promise.all([...subs.values()].map(([f, t, r]) => getSubway(f, t, r)));
  [...subs.keys()].forEach((k, i) => (cache[k] = subResults[i]));
  const results = await Promise.all(codes.map(getArrivals));
  codes.forEach((c, i) => (cache[c] = results[i]));
  fetchedAt = Date.now();
  $("#stops").classList.remove("spin");
  render();
  $("#updated").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle]");
  if (!t) return;
  const key = t.dataset.toggle;
  const top = (k) => k === "plan" || k.startsWith("s:");
  if (top(key) ? isOpen(key) : open.has(key)) { open.delete(key); dismissed.add(key); }
  else {
    // Accordion: opening a section closes the others at the same level.
    for (const k of [...open]) if (top(k) === top(key) && k !== key) open.delete(k);
    if (top(key)) { const n = nearestKey(); if (n && n !== key) dismissed.add(n); }
    open.add(key); dismissed.delete(key);
  }
  saveOpen();
  render();
});

// Home-screen apps can stay in memory for days; when the app comes back, reload if a new version was deployed.
let version = null;
async function currentVersion() {
  try {
    const r = await fetch("/?check=" + Date.now(), { method: "HEAD", cache: "no-store" });
    return r.headers.get("etag") || r.headers.get("last-modified");
  } catch { return null; }
}
async function checkForUpdate() {
  const v = await currentVersion();
  if (v && version && v !== version) location.reload();
  if (v && !version) version = v;
}

async function init() {
  checkForUpdate();
  locate();
  [stops, PLAN] = await Promise.all([
    fetch("/stops.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => []),
    fetch("/plan.json", { cache: "no-cache" }).then((r) => r.json()).catch(() => null),
  ]);
  render();
  refresh();
  setInterval(() => document.visibilityState === "visible" && refresh(), 30000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { checkForUpdate(); locate(); refresh(); }
  });
}

$("#refresh").onclick = refresh;
$("#lookup").onsubmit = async (e) => {
  e.preventDefault();
  const code = $("#code").value.trim();
  if (!/^\d{6}$/.test(code)) return;
  adhoc = code;
  cache[code] = null;
  render();
  cache[code] = await getArrivals(code);
  render();
  $("#code").blur();
};

init();
</script>
</body>
</html>
